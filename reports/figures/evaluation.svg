<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Synthetic one-step test weighted absolute percentage error comparison, LightGBM 18.469 percent versus weekly seasonal naive 29.012 percent"><rect width="880" height="330" rx="12" fill="#0b1220"/><text x="40" y="48" font-size="23" font-family="Arial" font-weight="bold" fill="#fff">Synthetic data · out-of-time one-step test WAPE</text><text x="40" y="80" font-size="15" font-family="Arial" fill="#b9c6d8">Lower is better. These values do not generalize to real-world retail.</text><text x="40" y="136" font-size="18" font-family="Arial" fill="#e5e7eb">LightGBM</text><rect x="235" y="111" width="368" height="38" rx="6" fill="#38bdf8"/><text x="619" y="137" font-size="18" font-family="Arial" fill="#e5e7eb">18.469%</text><text x="40" y="216" font-size="17" font-family="Arial" fill="#e5e7eb">Seasonal naive</text><rect x="235" y="191" width="580" height="38" rx="6" fill="#f59e0b"/><text x="724" y="218" font-size="18" font-family="Arial" fill="#0b1220">29.012%</text><text x="40" y="290" font-size="14" font-family="Arial" fill="#a6b6cb">Chronological holdout · deterministic seed 42 · 6,720 simulated sales rows</text></svg>
