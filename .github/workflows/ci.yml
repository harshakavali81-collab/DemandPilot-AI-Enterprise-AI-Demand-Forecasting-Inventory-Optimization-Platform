name: Test and lint
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/bootstrap.py
      - run: python -c "from fastapi.testclient import TestClient; from demandpilot.api.main import app; c=TestClient(app); assert c.get('/catalog').status_code==200; assert c.post('/forecast',json={'product_id':'P101','store_id':'HYD01','days':7}).status_code==200; assert c.get('/inventory/alerts').status_code==200"
