[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandpilot-ai"
version = "1.0.0"
description = "AI demand forecasting and inventory simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "lightgbm>=4.1,<5", "scikit-learn>=1.3,<2", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "streamlit>=1.32,<2", "plotly>=5.18,<7", "requests>=2.31,<3", "pydantic>=2.5,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
